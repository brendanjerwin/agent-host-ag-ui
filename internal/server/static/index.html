<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>agent-host-ag-ui test GUI</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background: #111;
      color: #eee;
    }

    #left {
      width: 60%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }

    #right {
      width: 40%;
      padding: 1rem;
      overflow-y: auto;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .msg {
      margin: 0.5rem 0;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      max-width: 85%;
    }

    .user {
      background: #1e3a5f;
      margin-left: auto;
    }

    .assistant {
      background: #233;
    }

    .thinking {
      color: #999;
      font-style: italic;
    }

    .tool {
      background: #2a2;
      padding: 0.5rem;
      border-radius: 6px;
      margin: 0.5rem 0;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .toolresult {
      background: #252;
      padding: 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }

    .error {
      background: #611;
      padding: 0.5rem;
      border-radius: 6px;
      margin: 0.5rem 0;
    }

    #inputrow {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid #333;
    }

    #input {
      flex: 1;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 0.6rem;
    }

    button {
      background: #345;
      color: #eee;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      cursor: pointer;
    }

    #eventlog {
      font-family: monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      color: #888;
      max-height: 30vh;
      overflow-y: auto;
    }

    #browserpanel img {
      max-width: 100%;
      border: 1px solid #444;
    }

    h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>
  <div id="left">
    <div id="log"></div>
    <div id="inputrow">
      <input id="input" placeholder="Type a message…">
      <button id="send">Send</button>
      <button id="reset" title="New thread">Reset</button>
    </div>
  </div>
  <div id="right">
    <h3>Thread</h3>
    <div id="threadid"></div>
    <h3>Raw events (last 100)</h3>
    <div id="eventlog"></div>
    <h3>Browser panel</h3>
    <div id="browserpanel"></div>
  </div>
  <script type="module">
    // Self-contained AG-UI consumer: fetch + manual SSE parse over POST /ag-ui.
    // No external client lib (esm.sh) — the wire shape we speak is our own.
    const KEY = "agent-host-ag-ui-thread";
    let threadId = localStorage.getItem(KEY);
    if (!threadId) {
      threadId = "t-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(KEY, threadId);
    }
    document.getElementById("threadid").textContent = threadId;

    const logEl = document.getElementById("log");
    const eventLog = document.getElementById("eventlog");
    const seen = [];
    function addEvent(ev) {
      seen.push(JSON.stringify(ev));
      if (seen.length > 100) seen.shift();
      eventLog.textContent = seen.join("\n");
    }

    function append(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      return d;
    }

    document.getElementById("reset").onclick = () => {
      localStorage.removeItem(KEY);
      location.reload();
    };

    // Wire shape (AG-UI): uppercase event `type` on every data line.
    // dispatch by that type so nothing depends on a client lib's mapping.
    const handlers = {
      RUN_STARTED: () => {window.__curAssistant = append("assistant", "");},
      TEXT_MESSAGE_START: () => {window.__curAssistant = append("assistant", "");},
      TEXT_MESSAGE_CONTENT: (ev) => {
        if (window.__curAssistant) window.__curAssistant.textContent += ev.delta;
      },
      TEXT_MESSAGE_END: () => {window.__curAssistant = null;},
      REASONING_MESSAGE_CONTENT: (ev) => {
        // thinking text renders into its own italic block
        if (!window.__curThinking) window.__curThinking = append("thinking", "");
        window.__curThinking.textContent += ev.delta;
      },
      REASONING_MESSAGE_END: () => {window.__curThinking = null;},
      TOOL_CALL_START: (ev) => {
        const d = document.createElement("div");
        d.className = "tool";
        d.id = "tool-" + ev.toolCallId;
        d.textContent = "tool " + ev.toolCallName + " ";
        logEl.appendChild(d);
      },
      TOOL_CALL_ARGS: (ev) => {
        const d = document.getElementById("tool-" + ev.toolCallId);
        if (d) d.textContent += ev.delta;
      },
      TOOL_CALL_END: () => { },
      TOOL_CALL_RESULT: (ev) => {
        const d = document.createElement("div");
        d.className = "toolresult";
        d.textContent = ev.content;
        logEl.appendChild(d);
      },
      ACTIVITY_SNAPSHOT: (ev) => {
        // Content carries the screenshot; our server emits
        // {screenshot: "data:image/png;base64,…", mime}
        const panelEl = document.getElementById("browserpanel");
        if (!panelEl) return;
        const src = (typeof ev.content === "string")
          ? ev.content
          : ev.content?.screenshot;
        if (typeof src !== "string" || !src.startsWith("data:image")) return;
        const img = document.createElement("img");
        img.src = src;
        panelEl.replaceChildren(img);
      },
      RUN_FINISHED: () => {
        window.__curAssistant = null;
        window.__curThinking = null;
      },
      RUN_ERROR: (ev) => {
        append("error", "Error: " + (ev.message || "run error"));
      },
    };

    async function runAgent(userText) {
      append("user", userText);
      const body = JSON.stringify({
        threadId,
        runId: "gui-" + Date.now(),
        messages: [{id: "m" + Date.now(), role: "user", content: userText}],
      });
      const resp = await fetch("/ag-ui", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body,
      });
      if (!resp.ok || !resp.body) {
        const txt = await resp.text().catch(() => "");
        append("error", "Fetch failed " + resp.status + " " + txt);
        return;
      }
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (; ;) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n")) !== -1) {
          const line = buf.slice(0, idx);
          buf = buf.slice(idx + 1);
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6);
          let ev;
          try {ev = JSON.parse(data);} catch {continue;}
          addEvent(ev);
          const h = handlers[ev.type];
          if (h) h(ev);
        }
      }
    }

    document.getElementById("send").onclick = () => {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      runAgent(text).catch(e => append("error", String(e)));
    };
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("send").click();
    });
  </script>
</body>

</html>
