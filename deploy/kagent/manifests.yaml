# agent-host-ag-ui + kagent (byo Harness) manifests — api.kagent.dev/v1alpha3.
# Shapes verified from kagent.dev 1.x docs (agent-harness + api-ref + byo).
# GitOps: everything here is declared; apply with kubectl (or ArgoCD later).
# Model provider note: kagent's provider column is a closed enum — these
# ModelConfigs are NAMED after the real providers (opencode-go / ollama-cloud)
# and speak OpenAI-compatible endpoints; the UI label reads the enum.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: opencode-go
  namespace: kagent
spec:
  provider: OpenAI
  model: glm-5.3-flash
  openAI:
    baseUrl: https://opencode.ai/zen/v1
  apiKeySecret: omp-key
  apiKeySecretKey: OPENCODE_API_KEY
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: ollama-cloud
  namespace: kagent
spec:
  provider: OpenAI
  model: glm-5.3-flash
  openAI:
    baseUrl: https://api.ollama.com/v1
  apiKeySecret: omp-key
  apiKeySecretKey: OLLAMA_CLOUD_API_KEY
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: agent-host-dot
  namespace: kagent
spec:
  description: omp coding-agent dot hosted by agent-host-ag-ui
  modelConfig:
    name: ollama-cloud
  systemPrompt: |
    You are the dots persona assistant hosted by agent-host-ag-ui.
    Execute user prompts with an omp coding-agent child. Keep replies direct.
    A browser tool (browser_open/browser_snapshot/browser_click/browser_fill/
    browser_screenshot) is available as host tools.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: agent-host-ag-ui
  namespace: kagent
spec:
  byo: {}
  workload:
    # CI-published digest for main HEAD (role:"reasoning" fix, ACTIVITY
    # mapping, cancel propagation). CI publishes <sha> + latest per commit.
    image: ghcr.io/brendanjerwin/agent-host-ag-ui@sha256:7a066f5962e3c44939e62e9465e503e73fd1bb8c66be9fce8a6afa35dedd48b0
    command: ["/usr/local/bin/agent-host-ag-ui"]
  env:
    - name: AGENT_HOST_AG_UI_ADDR
      value: ":8090"
    # BYO CONTRACT: the controller dials gRPC 127.0.0.1:80 unconditionally
    # (not configurable; KAGENT_PORT is only read by kagent's own ADKs).
    # The actor runs as root inside the gVisor sandbox, so :80 binds.
    - name: AGENT_HOST_AG_UI_A2A_ADDR
      value: ":80"
    - name: AGENT_HOST_AG_UI_A2A_HTTP_ADDR
      value: ":8091"
    - name: AGENT_HOST_AG_UI_READYZ_ADDR
      value: ":8081"
    - name: AGENT_HOST_AG_UI_SESSION_ROOT
      value: /data/sessions
    - name: AGENT_HOST_AG_UI_CWD
      value: /workspace
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: agent-host-dot
  namespace: kagent
spec:
  templateRef:
    name: agent-host-dot
  harnessRef:
    name: agent-host-ag-ui
